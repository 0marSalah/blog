# Builds the app and publishes `dist/` to GitHub Pages.
#
# Pages must be set to Source: "GitHub Actions" (not "Deploy from a branch").
# Serving the branch root publishes this repo's `index.html`, which is Vite's
# DEV entry -- it points at `/src/main.tsx`, a TypeScript file no browser can
# execute -- so the branch source can only ever produce a blank page.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5
        id: pages

      # `configure-pages` resolves the site's real base path, so a repo rename
      # does not silently break asset URLs.
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
